services:
  - type: web
    name: amibuzz
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_USE_FIREBASE_EMULATORS
        value: "false"
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyAmiBuzzProdClientKey2026"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "amibuzz-app.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "amibuzz-app"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "amibuzz-app.appspot.com"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "103948572910"
      - key: VITE_FIREBASE_APP_ID
        value: "1:103948572910:web:83940294819203948"
